<script>
const P = JSON.parse(document.getElementById('carga').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function descifra(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c)));
}
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  err.textContent = ''; go.disabled = true;
  try {
    if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
    const html = await descifra(document.getElementById('k').value);
    const v = document.getElementById('vista'); v.srcdoc = html; v.style.display = 'block';
    document.getElementById('gate').style.display = 'none';
  } catch (e) {
    err.textContent = e.message === 'nocrypto' ? 'Open this page over https. / Abre esta página por https.' : 'Wrong password. / Clave incorrecta.';
    go.disabled = false; document.getElementById('k').select();
  }
});
</script></body></html>
